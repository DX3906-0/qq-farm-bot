<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>QQ农场 Bot 快速面板</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card2: #263449;
    --text: #e2e8f0; --muted: #94a3b8;
    --green: #22c55e; --red: #ef4444; --amber: #f59e0b; --blue: #3b82f6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding-bottom: 40px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 16px; }
  header h1 { font-size: 18px; font-weight: 600; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .icon-btn { background: var(--card); border: 1px solid #334155; color: var(--text); border-radius: 10px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
  .icon-btn:active { background: var(--card2); }
  .banner { border-radius: 12px; padding: 12px 14px; font-size: 13px; margin-bottom: 14px; display: none; }
  .banner.err { display: block; background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); color: #fca5a5; }
  .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .acc-head { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.off { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,.6); }
  .acc-name { font-size: 16px; font-weight: 600; flex: 1; word-break: break-all; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--card2); color: var(--muted); flex-shrink: 0; }
  .acc-meta { font-size: 12px; color: var(--muted); margin: 8px 0 12px 20px; }
  .acc-actions { display: flex; gap: 10px; margin-left: 20px; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 11px 0; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
  .btn.start { background: var(--green); }
  .btn.stop { background: var(--red); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn:active:not(:disabled) { filter: brightness(.85); }
  .status-line { font-size: 13px; margin-left: 20px; margin-top: 10px; min-height: 16px; color: var(--amber); }
  h2 { font-size: 14px; color: var(--muted); margin: 20px 4px 10px; font-weight: 600; }
  .alert-item { background: var(--card); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 13px; }
  .alert-item .time { color: var(--muted); font-size: 11px; margin-top: 4px; }
  .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 20px 0; }
  .loading { text-align: center; color: var(--muted); padding: 40px 0; font-size: 14px; }
  /* 首次使用：输入访问密钥 */
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 10; }
  #gate .box { width: 90%; max-width: 400px; background: var(--card); border-radius: 16px; padding: 24px; }
  #gate h1 { font-size: 17px; margin-bottom: 6px; }
  #gate p { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.6; }
  #gate input { width: 100%; background: var(--bg); border: 1px solid #334155; color: var(--text); border-radius: 10px; padding: 12px; font-size: 14px; margin-bottom: 12px; }
  #gate .btn { width: 100%; background: var(--blue); }
  .spin { display: inline-block; animation: rot 1s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="gate">
  <div class="box">
    <h1>QQ农场 Bot 快速面板</h1>
    <p>首次使用请输入访问密钥（部署时生成的 48 位密钥，只需输入一次）。<br>密钥仅保存在本机浏览器。</p>
    <input id="tokenInput" type="password" placeholder="访问密钥" autocomplete="off">
    <button class="btn" onclick="saveToken()">进入面板</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <div>
      <h1>QQ农场 Bot</h1>
      <div class="sub" id="lastCheck">加载中…</div>
    </div>
    <button class="icon-btn" id="refreshBtn" onclick="refresh()">刷新</button>
  </header>

  <div class="banner err" id="banner"></div>
  <div id="accounts"><div class="loading"><span class="spin">⟳</span> 正在加载账号状态…</div></div>

  <h2>最近告警（7 天内）</h2>
  <div id="alerts"><div class="empty">加载中…</div></div>
</div>

<script>
const GW = location.origin;
const TOKEN_KEY = 'botPanelToken';

function getToken() { return localStorage.getItem(TOKEN_KEY) || ''; }
function saveToken() {
  const v = document.getElementById('tokenInput').value.trim();
  if (!v) return;
  localStorage.setItem(TOKEN_KEY, v);
  init();
}

async function api(path, opts = {}) {
  const resp = await fetch(GW + path, {
    ...opts,
    headers: { 'x-bot-token': getToken(), ...(opts.headers || {}) },
  });
  if (resp.status === 401) {
    localStorage.removeItem(TOKEN_KEY);
    location.reload();
    throw new Error('密钥无效');
  }
  return resp;
}

async function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.disabled = true; btn.textContent = '刷新中…';
  try {
    const resp = await api('/botMonitor');
    const data = await resp.json();
    if (!data.ok) throw new Error(data.error || '加载失败');
    renderAccounts(data.data.accounts, data.data.serverReachable);
    renderAlerts(data.data.alerts || []);
    document.getElementById('lastCheck').textContent =
      '最近巡检: ' + fmtTime(data.data.lastCheckedAt) + '（每 5 分钟自动检查）';
    document.getElementById('banner').className = 'banner err';
    if (!data.data.serverReachable) {
      const b = document.getElementById('banner');
      b.style.display = 'block';
      b.textContent = '🔴 Azure 服务器当前无法访问，以下状态可能不是最新的';
    }
  } catch (e) {
    document.getElementById('accounts').innerHTML = '<div class="empty">加载失败: ' + e.message + '</div>';
  } finally {
    btn.disabled = false; btn.textContent = '刷新';
  }
}

function renderAccounts(list, reachable) {
  const box = document.getElementById('accounts');
  if (!reachable) { box.innerHTML = ''; return; }
  if (!list || list.length === 0) {
    box.innerHTML = '<div class="empty">服务器上没有账号</div>';
    return;
  }
  box.innerHTML = list.map(a => `
    <div class="card" id="acc-${a.id}">
      <div class="acc-head">
        <span class="dot ${a.running ? 'on' : 'off'}"></span>
        <span class="acc-name">${esc(a.name || a.id)}</span>
        <span class="badge">${a.platform === 'qq' ? 'QQ' : '微信'}</span>
      </div>
      <div class="acc-meta">状态: ${a.running ? '运行中' : '已停止'}${a.gid ? ' · GID ' + esc(a.gid) : ''}</div>
      <div class="acc-actions">
        ${a.running
          ? `<button class="btn stop" onclick="act('${a.id}','stop',this)">停止</button>`
          : `<button class="btn start" onclick="act('${a.id}','start',this)">启动</button>`}
      </div>
      <div class="status-line" id="st-${a.id}"></div>
    </div>`).join('');
}

function renderAlerts(alerts) {
  const box = document.getElementById('alerts');
  if (!alerts.length) {
    box.innerHTML = '<div class="empty">暂无告警，一切正常 ✓</div>';
    return;
  }
  box.innerHTML = alerts.map(a => `
    <div class="alert-item">
      <div>${esc(a.msg || '')}</div>
      <div class="time">${fmtTime(a.at)}</div>
    </div>`).join('');
}

async function act(id, action, btn) {
  const line = document.getElementById('st-' + id);
  btn.disabled = true;
  line.textContent = action === 'start' ? '正在启动…' : '正在停止…';
  try {
    const resp = await api('/botProxy/api/accounts/' + id + '/' + action, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + resp.status));
    line.textContent = (action === 'start' ? '✓ 已发送启动指令' : '✓ 已停止') + '，3 秒后刷新状态';
    setTimeout(refresh, 3000);
  } catch (e) {
    line.style.color = 'var(--red)';
    line.textContent = '✗ ' + e.message;
    btn.disabled = false;
    setTimeout(() => { line.style.color = ''; }, 3000);
  }
}

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function init() {
  if (!getToken()) return; // 停留在密钥输入页
  document.getElementById('gate').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  refresh();
  setInterval(refresh, 30000);
}
init();
</script>
</body>
</html>
