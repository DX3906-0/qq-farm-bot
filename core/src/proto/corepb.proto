syntax = "proto3";

package corepb;

// ============ 通用物品 ============
message Item {
    int64 id = 1;           // 物品ID
    int64 count = 2;        // 数量
    int64 expire_time = 3;  // 过期时间
    // field 4 reserved
    // google.protobuf.Any detail = 5;  // 详情 (略)
    int64 uid = 6;          // UID
    bool is_new = 7;        // 是否新获得
    repeated int64 mutant_types = 8; // 变异类型
    bool locked = 9;                 // 官方物品锁定标志
    ItemSourceInfo source_info = 10;
    ItemShow show = 100;
}

// 背包（物品列表）
message ItemBag {
    repeated Item items = 1;
}

// ============ 物品变化 ============
message ItemChg {
    Item item = 1;          // 物品信息
    int64 delta = 2;        // 变化量 (正数增加, 负数减少)
}

// ============ 上游新增（2026-11-02 同步）============
// 以下 message 由上游 activity 体系重构时新增。本文件保留原有定义（本地业务仍在用），
// 同时补齐上游新协议，二者并存互不冲突（message 名不重复）。

message ItemShowRestriction {
    string text = 1;
    string activity_id = 2;
}

message ItemShow {
    ItemShowRestriction restriction = 3;
    Item sell_price = 4; // Currency and amount shown as the item's sale value.
    Item exchange_price = 5;
}

message ItemSourceInfo {
    string sender_name = 1;
    int64 sent_at = 2;
    int64 source_type = 3;
}

message BuffEffect {
    int64 attr_id = 1;
    int64 attr_value = 2;
    int64 extra_info = 3;
}

// ============ 牧场写回包通用结构（2026-11-17 二期，自固定上游 6ac7a3d 选取）============

// kind: 1=动物操作 2=货架收获 3=清理；target_id 按 kind 语义为动物实例/槽位/污物ID。
message FacilityOpResult {
    int64 facility_inst_id = 1;
    int32 kind = 2;
    int64 target_id = 3;
    repeated Item rewards = 10;
    repeated Item costs = 11;
}

message ItemEntry {
    int64 id = 1;
    int64 count = 2;
}
