// ---------- 奶茶热销中独立解码 schema ----------
// 为什么不用 ActivityNode？
//   1) ActivityNode.activity 是 ActivityInfo（字段只到 105），没有 settle_start_time(24)，
//      奶茶的结算期时间只下发在 ActivityHead.settle_start_time = 24，用 ActivityInfo 解恒为 0，
//      导致「结算期判定永久失效」（前端 settling 恒 false）。
//   2) ActivityNode.exchange_shop = 102 被既有活动占用为 ExchangeShopInfo（items 列表），
//      而奶茶子活动 2026110102 在同一字段号下发 ActivityBodyShop{goods}，
//      形状不同 → purchase_limit / category_tag / cond_hints 全部解不出，种子筛选与限购失效。
//   3) share_reward 挂在子活动 2026110104 上，需按 head.id 定位后单独取 summary。
// 因此照 404 上游做法，用独立 MilkTeaGroup / MilkTeaNode 解码 GetGroup 回包。
// 复用已存在的 MilkTeaActivityHead（含 settle_start_time = 24）与 milk-tea.proto 的活动体消息。
message MilkTeaNode {
    MilkTeaActivityHead head = 1;
    ActivityBodyShop shop = 102;
    ActivityBodyShareReward share_reward = 120;
    ActivityBodyMilkTea milk_tea = 121;
    ActivityBodyGrowthFund growth_fund = 122;
}

message MilkTeaGroup {
    MilkTeaActivityHead head = 1;
    repeated MilkTeaNode children = 2;
}

message MilkTeaGetGroupReply {
    MilkTeaGroup group = 1;
}
